services:
  relicframe-csharp-preview:
    build:
      context: ..
      dockerfile: csharp/Dockerfile
    restart: unless-stopped
    environment:
      RELICFRAME_CSHARP_TOKEN: ${RELICFRAME_CSHARP_TOKEN:?set in host secrets}
      RELICFRAME_TEST_GUILD_ID: ${RELICFRAME_TEST_GUILD_ID:?set in host secrets}
      RELICFRAME_WFM_WEBSOCKET: ${RELICFRAME_WFM_WEBSOCKET:-true}
      RELICFRAME_WFM_TOKEN: ${RELICFRAME_WFM_TOKEN:-}
      RELICFRAME_WFM_TOKEN_FILE: ${RELICFRAME_WFM_TOKEN_FILE:-/data/wfm-token.txt}
      RELICFRAME_PRIME_INVENTORY_JSON: ${RELICFRAME_PRIME_INVENTORY_JSON:-/data/prime_inventory.json}
      RELICFRAME_EE_LOG: ${RELICFRAME_EE_LOG:-false}
      RELICFRAME_EE_LOG_PATH: ${RELICFRAME_EE_LOG_PATH:-/data/EE.log}
      RELICFRAME_TRADE_OCR: ${RELICFRAME_TRADE_OCR:-false}
      RELICFRAME_TRADE_OCR_CAPTURE_FILE: ${RELICFRAME_TRADE_OCR_CAPTURE_FILE:-/data/trade-chat.png}
    volumes:
      - relicframe-csharp-state:/data

volumes:
  relicframe-csharp-state:
